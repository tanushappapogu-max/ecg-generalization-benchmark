[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-generalization-benchmark"
version = "0.1.0"
description = "Cross-dataset ECG generalization benchmark data and evaluation utilities."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
test = ["pytest>=8"]
train = [
    "huggingface-hub>=0.24",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.2",
    "wfdb>=4.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
